[project]
name = "travel-split-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["travel-split-backend"]

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
travel-split-backend = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["backend"]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"

[tool.mypy]
mypy_path = ["backend"]
python_version = "3.12"
exclude = ["^backend/alembic/"]
