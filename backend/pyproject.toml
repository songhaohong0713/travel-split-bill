[project]
name = "travel-split-backend"
version = "0.1.0"
description = "FastAPI backend for travel split billing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic",
    "fastapi",
    "httpx",
    "hypothesis",
    "mypy",
    "pydantic",
    "pyjwt>=2.14.0",
    "pymysql",
    "pytest",
    "ruff",
    "sqlalchemy",
    "tencentcloud-sdk-python>=3.1.174",
    "uvicorn",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]
