# CloudBase Run API deployment blueprint.
# This records the values to enter in the CloudBase Git deployment console;
# secrets are created in CloudBase and must never be committed here.
version: "1.0"
project: travel-split-bill
services:
  - name: travel-split-api
    build:
      context: backend
      dockerfile: Dockerfile
    port: 8080
    command:
      - sh
      - -c
      - exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080}
    healthCheck:
      path: /healthz
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    envFrom:
      secretRef:
        name: travel-split-bill-secrets
        keys:
          - CLOUDBASE_ENV_ID
          - CLOUDBASE_API_KEY
          - JWT_SECRET
          - WECHAT_APP_ID
          - WECHAT_APP_SECRET
          - COS_SECRET_ID
          - COS_SECRET_KEY
          - COS_BUCKET
          - COS_REGION
          - TENCENTCLOUD_SECRET_ID
          - TENCENTCLOUD_SECRET_KEY
          - TENCENTCLOUD_REGION
          - OCR_MAX_ATTEMPTS
          - CORS_ORIGINS

# Deferred: do not create an OCR worker service yet. The repository has no
# app.worker.run entrypoint and no production COS image loader, so deploying
# one would repeatedly fail instead of processing receipt jobs.